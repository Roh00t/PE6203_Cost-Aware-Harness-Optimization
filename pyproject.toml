[project]
name = "cost-aware-harness"
version = "0.1.0"
description = "PE6203 CA2: cost-aware agent harness for TUA-Bench"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Must match the version pinned by TUA-Bench (data/TUA-Bench/pyproject.toml).
    "harbor==0.6.3",
    "matplotlib==3.10.8",
    "mini-swe-agent==2.4.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.5",
]
