# V-E: the full variant with the expensive model (architecture §2), identical to V except the
# model file and the dollar cap. B_task scales by the gpt-oss-120b/20b price ratio (0.03/0.018 =
# 0.15/0.09 = 1.67), so V-E gets the same token budget as V: $0.01 x 1.67 = $0.0167.
config_id: V-E
model_file: configs/models/expensive.yaml
components: [C0, C1, C2, C3, C4, C5]
plugins:
  - harness.components.tools:build_hook        # C2 (Isha)
  - harness.components.recovery:build_hook     # C4 (Isha)
  - harness.components.submit_gate:build_hook  # C5 (Isha)
step_limit: 50
budget_usd: 0.0167
command_timeout: 180
