# V: the full variant. Base model with every component on (architecture §2).
# C2, C4 and C5 are separate plugins so each can also be ablated alone (c2/c4/c5.yaml).
# Run scripts/check_harness.py --config configs/harness/V.yaml to verify that all factories
# import after installing the pinned project dependencies.
config_id: V
model_file: configs/models/base.yaml
components: [C0, C1, C2, C3, C4, C5]
plugins:
  - harness.components.tools:build_hook        # C2 (Isha)
  - harness.components.recovery:build_hook     # C4 (Isha)
  - harness.components.submit_gate:build_hook  # C5 (Isha)
step_limit: 50
budget_usd: 0.01
command_timeout: 180
