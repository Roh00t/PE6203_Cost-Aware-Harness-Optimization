version: '3.8'

services:
  agent-harness:
    build: .
    container_name: tua_bench_harness
    env_file:
      - .env
    volumes:
      # Mount logs to host to preserve raw outputs after container teardown
      - ./logs:/app/logs
      # Mount custom agent instructions and guardrails
      - ./claude.md:/app/claude.md:ro
      - ./guardrails.md:/app/guardrails.md:ro
    # Host networking allows the harness to reach a locally running Harbor instance at localhost:8080
    network_mode: host
    restart: unless-stopped